<h3>O Batismo no Espírito Santo</h3>

<p>A Bíblia apresenta o Espírito Santo como aquele que habita no crente, ensina, guia, transforma e também capacita o discípulo para cumprir sua missão.</p>

];

const book = document.getElementById('book');

let current = 0;
let voices = [];
let speaking = false;

pages.forEach((content, i) => {

const p = document.createElement('div');

p.className = 'page ' + (i === 0 ? 'current' : 'next');

p.innerHTML = content;

book.appendChild(p);

});

function render(){

document.querySelectorAll('.page').forEach((p,i)=>{

p.className = 'page ' +
(i === current ? 'current' :
i < current ? 'past' : 'next');

});

document.getElementById('counter').textContent =
`${current+1} / ${pages.length}`;

}

function nextPage(){

if(current < pages.length-1){

stopSpeech();

current++;

render();

}

}

function prevPage(){

if(current > 0){

stopSpeech();

current--;

render();

}

}

function loadVoices(){

voices = speechSynthesis.getVoices();

}

loadVoices();

speechSynthesis.onvoiceschanged = loadVoices;

function getVoice(){

return voices.find(v=>/^pt-BR$/i.test(v.lang))
|| voices.find(v=>/^pt/i.test(v.lang))
|| voices[0];

}

function speakText(text){

stopSpeech();

const u = new SpeechSynthesisUtterance(text);

const v = getVoice();

if(v) u.voice = v;

u.lang = 'pt-BR';
u.rate = .92;
u.pitch = 1;
u.volume = 1;

u.onend = ()=>{

speaking = false;

};

speaking = true;

speechSynthesis.speak(u);

}

function speakPage(){

const text = document.querySelectorAll('.page')[current].innerText;

speakText(text);

}

function speakAll(){

stopSpeech();

let i = current;

function go(){

if(i >= pages.length){

speaking = false;

return;

}

current = i;

render();

const text = document.querySelectorAll('.page')[i].innerText;

const u = new SpeechSynthesisUtterance(text);

const v = getVoice();

if(v) u.voice = v;

u.lang = 'pt-BR';
u.rate = .92;

u.onend = ()=>{

i++;

go();

};

speaking = true;

speechSynthesis.speak(u);

}

go();

}

function stopSpeech(){

speechSynthesis.cancel();

speaking = false;

}

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen?.();

}else{

document.exitFullscreen?.();

}

}

document.addEventListener('keydown',e=>{

if(e.key==='ArrowRight') nextPage();

if(e.key==='ArrowLeft') prevPage();

if(e.key===' '){

e.preventDefault();

speakPage();

}

});

render();

</script>
